<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Детский сад «Сказка» — Астана</title>
<meta name="description" content="Детский сад «Сказка» в Астане: группы для детей от 2 до 7 лет, занятия на трёх языках, домашнее питание.">
<meta name="theme-color" content="#1A1250">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1A1250; --gold:#FFC83D; --pink:#FF8FB8; --mint:#5FD3B8; --sky:#7CC4FF; --lilac:#B79CFF; --coral:#FF9E7A;
  --bg:#FFF9EE; --bg-alt:#FFF1DC; --card:#FFFFFF; --text:#2A2350; --muted:#5A5480; --h:#1A1250;
  --line:rgba(26,18,80,.10); --shadow:0 10px 30px rgba(26,18,80,.10); --shadow-lg:0 18px 40px rgba(26,18,80,.16);
  --map-ground:#EAF5E4; --map-block:#FFE9C7; --map-road:#FFFFFF;
  --hh:76px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110C34; --bg-alt:#17114280; --card:#1E1752; --text:#F3EEFF; --muted:#BDB5E3; --h:#FFD978;
    --line:rgba(255,255,255,.10); --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 18px 40px rgba(0,0,0,.5);
    --map-ground:#1F2A4F; --map-block:#2C2366; --map-road:#3E3590;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110C34; --bg-alt:#17114280; --card:#1E1752; --text:#F3EEFF; --muted:#BDB5E3; --h:#FFD978;
  --line:rgba(255,255,255,.10); --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 18px 40px rgba(0,0,0,.5);
  --map-ground:#1F2A4F; --map-block:#2C2366; --map-road:#3E3590;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.script{font-family:Lobster,Pacifico,cursive;font-weight:400}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(26,18,80,.94);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 4px 20px rgba(10,6,40,.25)}
@supports (backdrop-filter:blur(8px)){.hdr{background:rgba(26,18,80,.82);backdrop-filter:blur(12px)}}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.logo{display:flex;align-items:center;gap:10px;color:var(--gold);text-decoration:none;min-height:44px;font-size:28px;line-height:1;white-space:nowrap}
.logo svg{width:34px;height:34px;flex:none}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:0 11px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{background:rgba(255,255,255,.12);color:var(--gold)}
.langs{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;flex:none}
.langs button{min-width:50px;min-height:44px;border:0;background:none;color:#fff;font:800 14px Nunito,sans-serif;border-radius:999px;cursor:pointer;letter-spacing:.02em;transition:background .2s,color .2s}
.langs button:hover{color:var(--gold)}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--indigo)}
@media (max-width:1100px){
  :root{--hh:116px}
  .hdr-in{flex-wrap:wrap;row-gap:0;padding-bottom:0}
  .langs{margin-left:auto}
  .nav{order:3;width:calc(100% + 32px);margin:2px -16px 0;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
  .nav::-webkit-scrollbar{display:none}
}
@media (max-width:380px){.logo{font-size:24px}.langs button{min-width:44px}}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;
  background:linear-gradient(180deg,#0B0830 0%,#1A1250 28%,#36267A 52%,#8E4A9E 70%,#E07AAE 84%,#FF9E7A 100%);
  padding:clamp(48px,9vw,96px) 16px 0}
.sky{position:absolute;inset:0 0 38% 0;pointer-events:none}
.star{position:absolute;width:var(--s);height:var(--s);background:#fff;border-radius:50%;opacity:.85;box-shadow:0 0 6px rgba(255,255,255,.8);animation:tw var(--d) ease-in-out var(--dl) infinite}
.star.big{background:none;box-shadow:none;width:auto;height:auto;font-size:var(--s);line-height:1;color:#FFF3C4;text-shadow:0 0 10px rgba(255,220,120,.9)}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.moon{position:absolute;top:clamp(28px,7vw,70px);right:clamp(18px,11vw,160px);width:clamp(48px,8vw,80px);aspect-ratio:1;border-radius:50%;box-shadow:16px 10px 0 0 #FFE9A8;filter:drop-shadow(0 0 22px rgba(255,233,168,.55));transform:rotate(-12deg)}
.shoot{position:absolute;top:14%;left:8%;width:160px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;transform:rotate(16deg);animation:shoot 1.5s ease-out 1.1s 1 forwards}
.shoot::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8)}
@keyframes shoot{0%{opacity:0;transform:rotate(16deg) translateX(0)}12%{opacity:1}100%{opacity:0;transform:rotate(16deg) translateX(min(60vw,560px))}}
.hero-in{position:relative;z-index:2;max-width:860px;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:15px}
.hero h1{margin:12px 0 0;font-size:clamp(64px,15vw,136px);line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(255,200,61,.45),0 4px 0 rgba(10,6,40,.35)}
.slogan{margin:10px auto 0;font-size:clamp(20px,3.4vw,28px);font-weight:800;max-width:720px;line-height:1.3}
.promise{margin:14px auto 0;max-width:620px;font-size:clamp(16px,2.2vw,19px);color:#E8E2FF}
.cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font-weight:800;font-size:17px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;text-align:center;line-height:1.2}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--indigo);box-shadow:0 5px 0 #D69A12,0 14px 26px rgba(10,6,40,.28)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-pink{background:var(--pink);color:var(--indigo);box-shadow:0 5px 0 #D9638F,0 14px 26px rgba(26,18,80,.18)}
.btn-mint{background:var(--mint);color:var(--indigo);box-shadow:0 5px 0 #34A88E,0 14px 26px rgba(26,18,80,.18)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:26px;padding:0;list-style:none}
.badges li{padding:6px 14px;border-radius:999px;background:rgba(10,6,40,.28);font-weight:700;font-size:14px}
.scape{position:relative;margin-top:clamp(20px,4vw,40px)}
.hills{position:absolute;left:0;bottom:0;width:100%;height:90px;display:block}
.castle{position:relative;display:block;width:min(660px,100%);height:auto;margin:0 auto}
.win{fill:#FFD66B;animation:flick 4s ease-in-out infinite}
.win:nth-of-type(3n){animation-delay:1.3s}.win:nth-of-type(4n){animation-delay:2.6s}
@keyframes flick{50%{fill:#FFC03D}}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:clamp(36px,6vw,70px);display:block;z-index:3}
.wave path{fill:var(--bg)}

/* ---------- Sections ---------- */
section{scroll-margin-top:var(--hh)}
.sec{padding:clamp(56px,9vw,96px) 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sec.alt{background:var(--bg-alt)}
.wrap{max-width:1180px;margin:0 auto}
.sec-head{text-align:center;max-width:720px;margin:0 auto clamp(32px,5vw,48px)}
h2{margin:0;font-size:clamp(38px,6vw,56px);line-height:1.1;color:var(--h)}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 14px;color:var(--gold);font-size:20px}
.divider::before,.divider::after{content:"";width:64px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--lilac))}
.divider::after{transform:scaleX(-1)}
.lead{margin:0;color:var(--muted);font-size:clamp(17px,2vw,19px)}
h3{margin:0;font-size:20px;line-height:1.3;font-weight:900}
p{margin:0}
.grid{display:grid;gap:clamp(16px,2.4vw,26px)}
.card{background:var(--card);border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.bubble{display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,var(--card));flex:none}

/* About */
.facts{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.fact{display:flex;gap:16px;padding:22px;align-items:flex-start}
.fact .bubble{width:58px;height:58px;font-size:28px}
.fact h3{font-size:19px;margin-bottom:4px}
.fact p{color:var(--muted);font-size:16px}

/* Groups */
.groups{grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr))}
.gcard{overflow:hidden;display:flex;flex-direction:column}
.gtop{position:relative;padding:22px 22px 30px;background:color-mix(in srgb,var(--c) 32%,var(--card));display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gtop::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:18px;background:radial-gradient(circle at 12px 18px,var(--card) 12px,transparent 12.5px) 0 0/24px 18px repeat-x}
.gicon{width:76px;height:76px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:40px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000)}
.age{background:var(--card);color:var(--text);font-weight:900;font-size:15px;padding:6px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(26,18,80,.08)}
.gbody{padding:8px 22px 24px;display:flex;flex-direction:column;gap:10px}
.gbody > p{color:var(--muted);font-size:16px}
.checks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}
.checks li{position:relative;padding-left:34px;font-weight:700;font-size:15.5px;line-height:1.4}
.checks li::before{content:"✓";position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--indigo);display:grid;place-items:center;font-size:13px;font-weight:900}

/* Day timeline */
.tl{--tw:78px;--g:40px;list-style:none;margin:0 auto;padding:0;max-width:780px;position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--tw) + var(--g)/2 - 2px);top:14px;bottom:14px;width:4px;border-radius:4px;background:linear-gradient(var(--gold),var(--pink),var(--lilac),var(--sky),var(--indigo))}
.tl li{display:grid;grid-template-columns:var(--tw) 1fr;column-gap:var(--g);position:relative;padding:8px 0}
.tl li::before{content:"";position:absolute;left:calc(var(--tw) + var(--g)/2 - 10px);top:28px;width:20px;height:20px;border-radius:50%;background:var(--c);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.tl time{font-weight:900;font-size:19px;text-align:right;padding-top:18px;font-variant-numeric:tabular-nums;color:var(--h)}
.tl-body{padding:14px 20px;display:flex;gap:14px;align-items:center}
.tl-body .bubble{width:48px;height:48px;font-size:24px}
.tl-body h3{font-size:18px}
.tl-body p{color:var(--muted);font-size:15.5px}
@media (max-width:560px){.tl{--tw:52px;--g:28px}.tl time{font-size:16px}.tl-body{padding:12px 14px;gap:10px}.tl-body .bubble{width:40px;height:40px;font-size:20px}}

/* Teachers */
.teachers{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tcard{padding:26px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:70px;background:color-mix(in srgb,var(--c) 28%,var(--card))}
.avatar{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 70%);border:5px solid var(--card);box-shadow:0 6px 18px rgba(26,18,80,.15);margin-bottom:6px}
.role{display:inline-block;font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 26%,var(--card))}
.tcard p{color:var(--muted);font-size:15.5px}

/* Meals */
.meals{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.meal{padding:24px;display:flex;flex-direction:column;gap:10px}
.meal-top{display:flex;justify-content:space-between;align-items:center}
.meal .bubble{width:64px;height:64px;font-size:34px}
.mtime{font-weight:900;font-size:16px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--coral) 30%,var(--card));font-variant-numeric:tabular-nums}
.mlabel{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meal p{font-size:16px}
.notes{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));margin-top:clamp(18px,3vw,28px)}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,var(--card));border:1px dashed color-mix(in srgb,var(--c) 70%,transparent);font-weight:700;font-size:15.5px}
.note span{font-size:24px;line-height:1.1}

/* Admission */
.steps{list-style:none;margin:0;padding:0;grid-template-columns:repeat(4,1fr);counter-reset:s;position:relative}
.step{position:relative;text-align:center;padding:0 6px}
.step-n{position:relative;z-index:1;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--gold);color:var(--indigo);display:grid;place-items:center;font-size:40px;box-shadow:0 5px 0 #D69A12,0 10px 22px rgba(26,18,80,.18)}
.step-n i{position:absolute;right:-8px;top:-6px;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:18px;box-shadow:0 3px 10px rgba(26,18,80,.18)}
.step:not(:last-child)::after{content:"";position:absolute;top:42px;left:calc(50% + 54px);right:calc(-50% + 54px);border-top:3px dashed var(--lilac)}
.step h3{margin-bottom:6px}
.step p{color:var(--muted);font-size:15.5px}
@media (max-width:900px){
  .steps{grid-template-columns:1fr 1fr;row-gap:36px}
  .step:nth-child(2)::after{display:none}
}
@media (max-width:540px){
  .steps{grid-template-columns:1fr;row-gap:0}
  .step{display:grid;grid-template-columns:76px 1fr;column-gap:16px;text-align:left;padding:0 0 28px}
  .step-n{width:72px;height:72px;font-size:34px;margin:0}
  .step:not(:last-child)::after{display:block;top:80px;bottom:6px;left:35px;right:auto;border-top:0;border-left:3px dashed var(--lilac)}
  .step:nth-child(2)::after{display:block}
}

/* Contacts */
.contacts{grid-template-columns:1.05fr 1fr;align-items:stretch}
@media (max-width:860px){.contacts{grid-template-columns:1fr}}
.cinfo{padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;gap:18px}
.cinfo:hover,.map:hover{transform:none}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clist li{display:flex;gap:14px;align-items:center}
.clist .bubble{width:52px;height:52px;font-size:24px}
.clabel{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cval{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.cval a{text-decoration:none;border-bottom:2px solid color-mix(in srgb,var(--gold) 70%,transparent)}
.cval a:hover{border-color:var(--pink)}
.cbtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.cbtns .btn{flex:1 1 200px}
.map{display:block;position:relative;overflow:hidden;text-decoration:none;color:var(--text);min-height:300px;scroll-margin-top:calc(var(--hh) + 16px)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.m-ground{fill:var(--map-ground)}.m-block{fill:var(--map-block)}.m-road{stroke:var(--map-road)}
.m-park{fill:#9FDDB0}.m-water{fill:var(--sky);opacity:.7}
.pin{animation:bob 2.4s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-8px)}}
.map-cta{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:20px;background:var(--card);box-shadow:var(--shadow-lg)}
.map-cta b{display:block;font-size:18px;font-weight:900}
.map-cta small{color:var(--muted);font-size:14px}
.map-cta .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--indigo);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;transition:transform .2s}
.map:hover .go{transform:translateX(4px)}

/* Footer */
.ftr{background:var(--indigo);color:#E8E2FF;text-align:center;padding:44px 16px calc(36px + env(safe-area-inset-bottom));position:relative}
.ftr .script{font-size:40px;color:var(--gold);display:block;line-height:1}
.ftr p{font-size:15px;margin-top:10px}
.demo{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:rgba(255,200,61,.14);color:var(--gold);font-weight:700;font-size:14px}
.ftr-stars{color:var(--gold);letter-spacing:10px;font-size:14px;margin-bottom:12px}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .shoot{display:none}
  .card:hover,.btn:hover{transform:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="logo script" href="#top">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#FFC83D" d="M6 36V20l4-6 4 6v3h3V12l3-9 3 9v11h3v-3l4-6 4 6v16H23v-7a3 3 0 0 0-6 0v7z"/><circle cx="20" cy="15" r="1.6" fill="#1A1250"/></svg>
      <span data-i="name">Сказка</span>
    </a>
    <nav class="nav" id="nav" aria-label="Меню"></nav>
    <div class="langs" role="group" aria-label="Язык">
      <button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button>
      <button type="button" data-lang="kz" aria-pressed="false" lang="kk">ҚАЗ</button>
      <button type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="sky" id="sky" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="shoot" aria-hidden="true"></div>
    <div class="hero-in">
      <span class="kicker"><span aria-hidden="true">✨</span><span data-i="hero.kicker"></span></span>
      <h1 class="script" data-i="name">Сказка</h1>
      <p class="slogan" data-i="hero.slogan"></p>

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function get(o, path){ return path.split('.').reduce(function(a,k){ return a == null ? a : a[k]; }, o); }
  function $(id){ return document.getElementById(id); }

  function render(lang){
    var t = I18N[lang];
    document.documentElement.lang = t.code;
    document.title = t.title;

    document.querySelectorAll('[data-i]').forEach(function(el){
      var v = get(t, el.getAttribute('data-i'));
      if (v != null) el.textContent = v;
    });

    var nav = $('nav');
    nav.setAttribute('aria-label', t.navLabel);
    nav.innerHTML = NAV.map(function(id,i){ return '<a href="#'+id+'">'+esc(t.nav[i])+'</a>'; }).join('');
    document.querySelector('.langs').setAttribute('aria-label', t.langLabel);

    $('badges').innerHTML = t.hero.badges.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('');

    $('facts').innerHTML = t.about.items.map(function(f,i){
      var s = SHARED.facts[i];
      return '<div class="card fact" style="--c:'+C(s[1])+'"><span class="bubble" aria-hidden="true">'+s[0]+'</span><div><h3>'+esc(f[0])+'</h3><p>'+esc(f[1])+'</p></div></div>';
    }).join('');

    $('groupList').innerHTML = t.groups.items.map(function(g,i){
      var s = SHARED.groups[i];
      return '<article class="card gcard" style="--c:'+C(s[1])+'"><div class="gtop"><span class="gicon" aria-hidden="true">'+s[0]+'</span><span class="age">'+esc(g[1])+'</span></div>'+
        '<div class="gbody"><h3>'+esc(g[0])+'</h3><p>'+esc(g[2])+'</p><ul class="checks">'+g[3].map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></div></article>';
    }).join('');

    $('dayList').innerHTML = t.day.items.map(function(d,i){
      var s = SHARED.day[i];
      return '<li style="--c:'+C(s[2])+'"><time>'+s[0]+'</time><div class="card tl-body"><span class="bubble" aria-hidden="true">'+s[1]+'</span><div><h3>'+esc(d[0])+'</h3><p>'+esc(d[1])+'</p></div></div></li>';
    }).join('');

    $('teacherList').innerHTML = t.teachers.items.map(function(p,i){
      var s = SHARED.teachers[i];
      return '<article class="card tcard" style="--c:'+C(s[1])+'"><span class="avatar" aria-hidden="true">'+s[0]+'</span><h3>'+esc(p[0])+'</h3><span class="role">'+esc(p[1])+'</span><p>'+esc(p[2])+'</p></article>';
    }).join('');

    $('mealList').innerHTML = t.meals.items.map(function(m,i){
      var s = SHARED.meals[i];
      return '<article class="card meal" style="--c:'+C(s[2])+'"><div class="meal-top"><span class="bubble" aria-hidden="true">'+s[0]+'</span><span class="mtime">'+s[1]+'</span></div><h3>'+esc(m[0])+'</h3><span class="mlabel">'+esc(t.meals.menuLabel)+'</span><p>'+esc(m[1])+'</p></article>';
    }).join('');

    $('noteList').innerHTML = t.meals.notes.map(function(n,i){
      var s = SHARED.notes[i];
      return '<p class="note" style="--c:'+C(s[1])+'"><span aria-hidden="true">'+s[0]+'</span>'+esc(n)+'</p>';
    }).join('');

    $('stepList').innerHTML = t.admission.items.map(function(st,i){
      return '<li class="step"><div class="step-n script">'+(i+1)+'<i aria-hidden="true">'+SHARED.steps[i]+'</i></div><div><h3>'+esc(st[0])+'</h3><p>'+esc(st[1])+'</p></div></li>';
    }).join('');

    document.querySelectorAll('.langs button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
  }

  function pickLang(){
    try { var s = localStorage.getItem('skazka-lang'); if (I18N[s]) return s; } catch(e){}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i=0;i<list.length;i++){
      var c = String(list[i]||'').toLowerCase().slice(0,2);
      if (c === 'kk') return 'kz';
      if (c === 'fr') return 'fr';
      if (c === 'ru') return 'ru';
    }
    return 'ru';
  }

  document.querySelector('.langs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    var lang = b.getAttribute('data-lang');
    render(lang);
    try { localStorage.setItem('skazka-lang', lang); } catch(err){}
  });

  /* Twinkling stars (decorative) */
  (function(){
    var sky = $('sky'), seed = 7, html = '';
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i=0;i<90;i++){
      var big = i % 15 === 0;
      html += '<span class="star'+(big?' big':'')+'" style="left:'+(rnd()*100).toFixed(2)+'%;top:'+(rnd()*100).toFixed(2)+'%;--s:'+(big?(14+rnd()*8).toFixed(0)+'px':(1+rnd()*2.4).toFixed(1)+'px')+
        ';--d:'+(2+rnd()*4).toFixed(1)+'s;--dl:'+(rnd()*4).toFixed(1)+'s">'+(big?'✦':'')+'</span>';
    }
    sky.innerHTML = html;
  })();

  render(pickLang());
})();
